# Publish the Stata package and the gallery to GitHub Pages
# (https://wbuchanan.github.io/dash/) once CI has passed on main.
name: pages

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main holds by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp stata.toc dash.pkg _site/
          awk '$1 == "f" { print $2 }' dash.pkg | xargs -I{} cp {} _site/
          cp -R docs/gallery _site/gallery
          # The landing page, from README.md (standard library only).
          python3 scripts/pages_index.py README.md _site/index.html
          # The user's guide and its examples (built by make guide).
          mkdir -p _site/guide/examples
          cp docs/guide/examples/*.html docs/guide/examples/*.do _site/guide/examples/
          python3 scripts/pages_index.py --guide docs/guide _site/guide/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5